{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="tool-section">
    <h2><i class="fas fa-exchange-alt"></i> {{ title }}</h2>
    <p>Convert your file quickly and easily.</p>
    
    <form action="{{ url_for(action) }}" method="POST" enctype="multipart/form-data" class="pdf-form">
        {% include 'partials/upload_area.html' with context %}
        <button type="submit" class="btn">
            <i class="fas fa-exchange-alt"></i> Convert Now
        </button>
    </form>
</section>
{% endblock %}
