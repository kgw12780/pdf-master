{% extends "base.html" %}

{% block title %}PDF to JPG{% endblock %}

{% block content %}
<section class="tool-section">
    <h2><i class="fas fa-file-image"></i> PDF to JPG</h2>
    <p>Convert your PDF pages to JPG images.</p>
    
    <form method="POST" enctype="multipart/form-data" class="pdf-form">
        {% include 'partials/upload_area.html' with context %}
        <button type="submit" class="btn">
            <i class="fas fa-file-image"></i> Convert to JPG
        </button>
    </form>
</section>
{% endblock %}
