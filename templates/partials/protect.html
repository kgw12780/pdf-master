{% extends "base.html" %}

{% block title %}Protect PDF{% endblock %}

{% block content %}
<section class="tool-section">
    <h2><i class="fas fa-lock"></i> Protect PDF</h2>
    <p>Encrypt your PDF with a password.</p>
    
    <form method="POST" enctype="multipart/form-data" class="pdf-form">
        {% set file_input_name = "file" %}
        {% set accept_types = ".pdf" %}
        {% set multiple = false %}
        {% include 'partials/upload_area.html' %}
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" required>
        </div>
        
        <button type="submit" class="btn">
            <i class="fas fa-lock"></i> Protect PDF
        </button>
    </form>
</section>
{% endblock %}
