{% extends "base.html" %}

{% block title %}PDF to PowerPoint{% endblock %}

{% block content %}
<section class="tool-section">
    <h2><i class="fas fa-file-powerpoint"></i> PDF to PowerPoint</h2>
    <p>Convert your PDF file to a PowerPoint presentation.</p>
    
    <form method="POST" enctype="multipart/form-data" class="pdf-form">
        {% include 'partials/upload_area.html' with context %}
        <button type="submit" class="btn">
            <i class="fas fa-file-powerpoint"></i> Convert to PowerPoint
        </button>
    </form>
</section>
{% endblock %}
