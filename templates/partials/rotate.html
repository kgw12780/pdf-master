{% extends "base.html" %}

{% block title %}Rotate PDF{% endblock %}

{% block content %}
<section class="tool-section">
    <h2><i class="fas fa-sync-alt"></i> Rotate PDF</h2>
    <p>Rotate the pages of your PDF document.</p>
    
    <form method="POST" enctype="multipart/form-data" class="pdf-form">
        {% include 'partials/upload_area.html' %}
        
        <div class="form-group">
            <label for="angle">Rotation Angle:</label>
            <select name="angle" id="angle" required>
                <option value="90">90 degrees clockwise</option>
                <option value="180">180 degrees</option>
                <option value="270">90 degrees counter-clockwise</option>
            </select>
        </div>
        
        <button type="submit" class="btn">
            <i class="fas fa-sync-alt"></i> Rotate PDF
        </button>
    </form>
</section>
{% endblock %}
