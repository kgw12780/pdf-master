{% extends "base.html" %}

{% block title %}Split PDF{% endblock %}

{% block content %}
<section class="tool-section">
    <h2><i class="fas fa-cut"></i> Split PDF</h2>
    <p>Extract specific pages from your PDF file.</p>
    
    <form method="POST" enctype="multipart/form-data" class="pdf-form">
        {% set file_input_name = "file" %}
        {% set accept_types = ".pdf" %}
        {% set multiple = false %}
        {% include 'partials/upload_area.html' %}
        
        <div class="form-group">
            <label for="start_page">Start Page:</label>
            <input type="number" name="start_page" id="start_page" min="1" value="1" required>
        </div>
        
        <div class="form-group">
            <label for="end_page">End Page:</label>
            <input type="number" name="end_page" id="end_page" min="1" value="1" required>
        </div>
        
        <button type="submit" class="btn">
            <i class="fas fa-cut"></i> Split PDF
        </button>
    </form>
</section>
{% endblock %}
