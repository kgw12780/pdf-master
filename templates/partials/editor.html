{% extends "base.html" %}

{% block title %}PDF Editor{% endblock %}

{% block content %}
<section class="tool-section">
    <h2><i class="fas fa-edit"></i> PDF Editor</h2>
    <p>Add text to your PDF document.</p>
    
    <form action="{{ url_for('pdf_editor') }}" method="POST" enctype="multipart/form-data" class="pdf-form">
        {% include 'partials/upload_area.html' with context %}
        
        <button type="submit" class="btn">
            <i class="fas fa-edit"></i> Add Text to PDF
        </button>
    </form>
</section>
{% endblock %}
